name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build Windows executable
        run: python -m PyInstaller scripts/glm-ui.spec --noconfirm --clean

      - name: Upload portable app artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLM-5.1-UI-Windows
          path: dist/GLM-5.1-UI/
          retention-days: 90

      - name: Create release zip
        run: |
          Compress-Archive -Path dist/GLM-5.1-UI/* -DestinationPath dist/GLM-5.1-UI-Windows.zip

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: GLM-5.1-UI-Windows-zip
          path: dist/GLM-5.1-UI-Windows.zip
          retention-days: 90
